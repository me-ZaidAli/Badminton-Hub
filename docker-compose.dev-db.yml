services:
  db:
    image: postgres:16
    container_name: badminton-hub-db
    environment:
      POSTGRES_USER: zaidali
      POSTGRES_PASSWORD: badminton
      POSTGRES_DB: badmintonhub
    ports:
      - "5432:5432"
    volumes:
      - badminton_hub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zaidali -d badmintonhub"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  badminton_hub_pgdata:
